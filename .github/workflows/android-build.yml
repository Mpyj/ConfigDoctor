name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ─── رمزگشایی keystore از Secrets ───
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/configdoctor-release.jks

      # ─── بیلد دیباگ ───
      - name: Build Debug APKs
        run: gradle assembleDebug

      # ─── بیلد ریلیز (با keystore واقعی) ───
      - name: Build Release APKs
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/configdoctor-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # --- آپلود جداگانه‌ی هر APK دیباگ ---
      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: debug-armeabi-v7a
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v4
        with:
          name: debug-x86
          path: app/build/outputs/apk/debug/app-x86-debug.apk

      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk

      - name: Upload Debug APK (Universal)
        uses: actions/upload-artifact@v4
        with:
          name: debug-universal
          path: app/build/outputs/apk/debug/app-universal-debug.apk

      # --- آپلود جداگانه‌ی هر APK ریلیز ---
      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload Release APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: release-armeabi-v7a
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk

      - name: Upload Release APK (x86)
        uses: actions/upload-artifact@v4
        with:
          name: release-x86
          path: app/build/outputs/apk/release/app-x86-release.apk

      - name: Upload Release APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: app/build/outputs/apk/release/app-x86_64-release.apk

      - name: Upload Release APK (Universal)
        uses: actions/upload-artifact@v4
        with:
          name: release-universal
          path: app/build/outputs/apk/release/app-universal-release.apk

      # --- انتشار در Releases ---
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: Config Doctor v0.1.0-${{ github.run_number }}
          body: |
            🚀 نسخه جدید Config Doctor

            **قابلیت‌ها:**
            - تشخیص خودکار مشکلات کانفیگ (TCP, TLS, Real Delay)
            - ترمیم خودکار IP سوخته (Auto-Heal) با ۴ مرحله (TCP، Real Delay، پایداری، پکت‌لاس)
            - پشتیبانی از VLESS, VMess, Trojan
            - نمایش IP و کشور خروجی
            - نمایش پکت‌لاس، جیتر و میانگین پینگ
            - تاریخچه تست‌ها

            **فایل‌های APK:**
            - `app-arm64-v8a-release.apk` (برای اکثر گوشی‌های مدرن)
            - `app-armeabi-v7a-release.apk` (برای گوشی‌های قدیمی‌تر)
            - `app-x86-release.apk` و `app-x86_64-release.apk` (برای شبیه‌سازها)
            - `app-universal-release.apk` (جامع برای همه)
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}