name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # مجوز لازم برای ساخت Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # بیلد دیباگ (برای تست خودت)
      - name: Build Debug APKs
        run: gradle assembleDebug

      # بیلد ریلیز (برای انتشار)
      - name: Build Release APKs
        run: gradle assembleRelease

      # آپلود آرتیفکت‌های دیباگ (همه معماری‌ها)
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: config-doctor-debug
          path: app/build/outputs/apk/debug/*.apk
          archive: false

      # آپلود آرتیفکت‌های ریلیز (همه معماری‌ها)
      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: config-doctor-release
          path: app/build/outputs/apk/release/*.apk
          archive: false

      # انتشار خودکار در Releases
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: Config Doctor v0.1.0-${{ github.run_number }}
          body: |
            🚀 نسخه جدید Config Doctor
            
            **قابلیت‌ها:**
            - تشخیص خودکار مشکلات کانفیگ (TCP, TLS, Real Delay)
            - ترمیم خودکار IP سوخته (Auto-Heal)
            - پشتیبانی از VLESS, VMess, Trojan
            - نمایش IP و کشور خروجی
            - تاریخچه تست‌ها
            
            **فایل‌های APK:**
            - `app-arm64-v8a-release.apk` (برای اکثر گوشی‌های مدرن)
            - `app-armeabi-v7a-release.apk` (برای گوشی‌های قدیمی‌تر)
            - `app-x86-release.apk` و `app-x86_64-release.apk` (برای شبیه‌سازها)
            - `app-universal-release.apk` (جامع برای همه)
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}